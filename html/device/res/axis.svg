<svg id="axis" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <!-- g 统一加样式 -->
    <g font-size="3" text-anchor="middle" stroke="currentColor" stroke-width="2" fill="currentColor" font-family="monospace">
        <line vector-effect="non-scaling-stroke" x1="5" y1="5" x2="97" y2="5"></line>
        <text vector-effect="non-scaling-stroke" x="97" y="6" transform="rotate(90, 97, 5)">▲</text>
        <line vector-effect="non-scaling-stroke" x1="5" y1="5" x2="5" y2="97"></line>
        <text vector-effect="non-scaling-stroke" x="5" y="97" transform="rotate(180, 5, 97)">▲</text>
    </g>
    <g fill="currentColor" font-weight="bold" font-family="monospace" vector-effect="non-scaling-stroke">
        <text x="0" y="5" font-size="6">0</text>
        <text x="88" y="4" text-anchor="middle" font-size="4">255(蓝)</text>
        <text text-anchor="middle" font-size="4" y="89" x="1" transform="rotate(90, 1, 89)">255(绿)</text>
    </g>
</svg>